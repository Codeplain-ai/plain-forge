name: pr-notify

# Posts to the "merged to main" Slack channel when a PR targeting main is
# opened, and again when it lands.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, closed]

permissions: {}

jobs:
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}

    steps:
      - name: Notify Slack (pull request opened)
        if: ${{ github.event.action != 'closed' && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          TEXT=$(jq -n \
            --arg t "$PR_TITLE" --arg u "$PR_URL" --arg n "$PR_NUMBER" --arg a "$PR_AUTHOR" \
            '{text: ("*plain-forge*: PR <" + $u + "|#" + $n + " " + $t + "> opened by *" + $a + "* → `main`.")}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' --data "$TEXT"

      - name: Notify Slack (merged to main)
        if: ${{ github.event.action == 'closed' && github.event.pull_request.merged && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          TEXT=$(jq -n \
            --arg t "$PR_TITLE" --arg u "$PR_URL" --arg n "$PR_NUMBER" --arg a "$PR_AUTHOR" \
            '{text: ("*plain-forge*: <" + $u + "|#" + $n + " " + $t + "> merged to `main` :white_check_mark: — by *" + $a + "*.")}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' --data "$TEXT"

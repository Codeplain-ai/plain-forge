name: pr-notify

# Posts to Slack when a PR lands on main. Opening a PR notifies nobody —
# this channel reports what actually merged.
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    # Release PRs are bookkeeping for the publish workflow, which posts its
    # own messages — staying quiet here keeps the channel to human changes.
    if: >-
      ${{ github.event.pull_request.merged
          && !startsWith(github.event.pull_request.head.ref, 'release/')
          && github.event.pull_request.user.login != 'github-actions[bot]' }}

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}

    steps:
      - name: Notify Slack (merged to main)
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        run: |
          TEXT=$(jq -n \
            --arg t "$PR_TITLE" --arg u "$PR_URL" --arg n "$PR_NUMBER" --arg a "$PR_AUTHOR" \
            '{text: ("*plain-forge*: <" + $u + "|#" + $n + " " + $t + "> merged to `main` :white_check_mark: — by *" + $a + "*.")}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' --data "$TEXT"

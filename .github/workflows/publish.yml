name: publish

# Publishes to npm when the version in package.json changes on main.
# Bump the version in a PR; merging it ships the release.
#
# Auth is OIDC (npm trusted publishing) — no NPM_TOKEN secret. The trusted
# publisher must be configured once on npmjs.com for this repo and this exact
# workflow filename (publish.yml).
on:
  push:
    branches: [main]
    paths: ['package.json']

# Least privilege by default: jobs get no GITHUB_TOKEN scopes unless they
# opt in below.
permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Notify Slack (tests failed)
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"*plain-forge*: tests FAILED :x: on \`main\`. Nothing was published to npm. See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.\"}"

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push the version tag, create the release
      id-token: write      # OIDC token for trusted publishing

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22      # trusted publishing needs >= 22.14
          cache: npm

      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Read version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already on npm
        id: check
        run: |
          if npm view "plain-forge@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "already published: ${{ steps.pkg.outputs.version }}"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack (start)
        if: ${{ steps.check.outputs.publish == 'true' && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"*plain-forge*: \`v${{ steps.pkg.outputs.version }}\` merged by *${{ github.actor }}* — publishing to npm...\"}"

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a
      # short-lived npm token. Provenance is attached automatically.
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public

      - name: Tag the release
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create the GitHub release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes

      - name: Notify Slack (success)
        if: ${{ success() && steps.check.outputs.publish == 'true' && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"*plain-forge*: \`v${{ steps.pkg.outputs.version }}\` published to npm :white_check_mark:. Install with \`npx plain-forge@latest update\`.\"}"

      - name: Notify Slack (failure)
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"*plain-forge*: publishing \`v${{ steps.pkg.outputs.version }}\` to npm FAILED :x:. See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.\"}"

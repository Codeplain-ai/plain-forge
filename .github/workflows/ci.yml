name: ci

# Runs the test suite on every pull request, and on main after a merge.
on:
  pull_request:
  push:
    # release/** matters: a PR opened by GITHUB_TOKEN does not trigger
    # pull_request workflows, so the required checks have to come from the
    # push event on the release branch instead.
    branches: [main, 'release/**']

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
